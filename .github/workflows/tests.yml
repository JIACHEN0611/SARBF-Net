name: CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m tools.sarbf_net.smoke
      - run: python -m tools.sarbf_net.run --task ETTm1-96 --dry-run
      - run: python -m tools.saer_transfer.smoke
      - run: python -m tools.saer_transfer.run --backbone DLinear --dataset ETTm1 --horizon 96 --seed 2021 --arm sa_frontend --dry-run
